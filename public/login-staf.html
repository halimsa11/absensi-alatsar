<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Staf - Admin</title>
  <link rel="icon" href="logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="toast.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
    
    <div class="text-center">
      <img src="logo.png" onerror="this.style.display='none'" alt="Logo" class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-emerald-50 p-2 shadow-sm border border-emerald-100 object-contain">
      <h1 class="text-2xl font-bold text-slate-800">Login Admin</h1>
      <p class="text-sm text-slate-500 mt-1">Sistem Absensi Al-Atsar</p>
    </div>

    <form id="formLoginAdmin" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Username</label>
        <input type="text" id="username" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none transition text-sm font-medium" placeholder="Masukkan username">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none transition text-sm font-medium" placeholder="••••••••">
      </div>
      
      <button type="submit" id="btnSubmit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 rounded-xl transition shadow-sm text-sm">Masuk Dashboard</button>
    </form>

    <!-- Tombol Kembali ke Menu Utama -->
    <div class="pt-2 border-t border-slate-100 text-center">
      <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-emerald-800 transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Menu Utama
      </a>
    </div>

  </div>

  <script>
    const getBaseUrl = () => '';
    const token = localStorage.getItem('stafToken');
    const role = localStorage.getItem('stafRole');
    if (token) {
      window.location.href = role === 'super_admin' ? 'admin-siswa.html' : 'admin-rekap.html';
    }

    document.getElementById('formLoginAdmin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; 
      btn.innerText = 'Memverifikasi...';

      try {
        const res = await fetch(`${getBaseUrl()}/api/staf/login`, {
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value 
          })
        });
        const result = await res.json();
        if (res.ok && result.success) {
          localStorage.setItem('stafToken', result.token);
          localStorage.setItem('stafRole', result.role);
          sessionStorage.setItem('flashToast', JSON.stringify({ message: 'Login berhasil!', type: 'success' }));
          
          if (result.role === 'super_admin') {
            window.location.href = 'admin-siswa.html';
          } else {
            window.location.href = 'admin-rekap.html';
          }
        } else { 
          showToast(result.message || 'Kredensial salah!', 'error'); 
          btn.disabled = false; 
          btn.innerText = 'Masuk Dashboard'; 
        }
      } catch (err) { 
        showToast('Terjadi kesalahan koneksi server', 'error'); 
        btn.disabled = false; 
        btn.innerText = 'Masuk Dashboard'; 
      }
    });

    checkFlashToast('Silakan masukkan username dan password');
    lucide.createIcons();
  </script>
</body>
</html>
