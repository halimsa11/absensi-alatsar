<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Santri - Absensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">
  
  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-sm">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-tight">👤 Portal Santri</h1>
        <p class="text-slate-400 text-xs">Silakan lakukan absensi kehadiranmu</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3.5 py-2 rounded-xl transition">Keluar</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-xl mx-auto px-6 py-12 w-full space-y-6">
    <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium shadow-sm"></div>

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80">
      <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
        <span>📌</span> Form Kehadiran Santri
      </h2>
      
      <form id="formAbsensi" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pilih Nama Santri</label>
          <select id="selectSantri" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-slate-800 font-medium text-slate-800" required>
            <option value="">-- Memuat daftar santri... --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Keterangan Kehadiran</label>
          <select id="selectStatus" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-slate-800 font-medium text-slate-800" required>
            <option value="Hadir">Hadir</option>
            <option value="Sakit">Sakit</option>
            <option value="Alfa">Alfa</option>
          </select>
        </div>

        <div class="pt-2">
          <button type="submit" id="btnKirim" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-2xl transition text-sm shadow-sm">
            Kirim Absensi
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-slate-400 font-medium">
    &copy; 2026 Sistem Absensi Santri
  </footer>

  <script>
    function showAlert(message, isSuccess = true) {
      const box = document.getElementById('alertBox');
      box.className = `p-4 rounded-2xl text-sm font-medium shadow-sm block ${isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`;
      box.innerText = message;
    }

    // Cek batasan waktu saat halaman dibuka
    function cekBatasWaktu() {
      const sekarang = new Date();
      const jam = sekarang.getHours();
      const menit = sekarang.getMinutes();
      const totalMenitSekarang = jam * 60 + menit;
      const batasTutupMenit = 14 * 60 + 30; // 14.30

      if (totalMenitSekarang > batasTutupMenit) {
        showAlert('⚠️ Waktu absen telah ditutup. Anda tidak dapat melakukan absensi lewat dari pukul 14.30.', false);
        document.getElementById('formAbsensi').style.opacity = '0.5';
        document.getElementById('selectSantri').disabled = true;
        document.getElementById('selectStatus').disabled = true;
        document.getElementById('btnKirim').disabled = true;
        document.getElementById('btnKirim').innerText = 'Absensi Ditutup';
        return false;
      }
      return true;
    }

    async function loadDropdownSantri() {
      const select = document.getElementById('selectSantri');
      try {
        const res = await fetch('/api/students');
        const result = await res.json();
        
        if (result.success && result.data.length > 0) {
          select.innerHTML = '<option value="">-- Pilih Nama Santri --</option>';
          result.data.forEach(santri => {
            let infoKelas = '';
            if (santri.classId == 10) infoKelas = ' (Kelas 10)';
            else if (santri.classId == 11) infoKelas = ' (Kelas 11)';
            else if (santri.classId == 12) infoKelas = ' (Kelas 12)';

            select.innerHTML += `<option value="${santri.id}">${santri.fullName}${infoKelas}</option>`;
          });
        } else {
          select.innerHTML = '<option value="">Belum ada data santri</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">Gagal memuat data santri</option>';
      }
    }

    document.getElementById('formAbsensi').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!cekBatasWaktu()) return;

      const studentId = document.getElementById('selectSantri').value;
      const status = document.getElementById('selectStatus').value;

      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId: parseInt(studentId), status })
        });
        const result = await res.json();

        if (res.ok && result.success) {
          showAlert('✅ Absensi berhasil dicatat dan masuk ke rekap!');
          document.getElementById('formAbsensi').reset();
        } else {
          showAlert(`⚠️ ${result.message || 'Gagal mencatat absensi'}`, false);
        }
      } catch (err) {
        showAlert('❌ Gagal terhubung ke server.', false);
      }
    });

    cekBatasWaktu();
    loadDropdownSantri();
  </script>
</body>
</html>
