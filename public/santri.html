<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Santri - Absensi Kehadiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">
  
  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-sm">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-tight">👤 Portal Santri</h1>
        <p class="text-slate-400 text-xs">Formulir Absensi Kehadiran Harian</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="logoutSantri()" class="text-xs bg-rose-600 hover:bg-rose-700 text-white font-medium px-3.5 py-2 rounded-xl transition">Keluar / Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-xl mx-auto px-6 py-10 w-full space-y-6">
    <!-- Card Identitas Santri -->
    <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-sm space-y-1">
      <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Selamat Datang,</p>
      <h2 id="dispNama" class="text-xl font-bold text-white">...</h2>
      <p id="dispDetail" class="text-xs text-slate-300 font-mono pt-1">NISN: - | Kelas: -</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium shadow-sm"></div>

    <!-- Form Absensi -->
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80">
      <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
        <span>📌</span> Input Kehadiran Hari Ini
      </h3>
      
      <form id="formAbsensi" class="space-y-4" autocomplete="off">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Keterangan Kehadiran</label>
          <select id="selectStatus" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-slate-800 font-medium text-slate-800" required>
            <option value="Hadir">Hadir</option>
            <option value="Sakit">Sakit</option>
            <option value="Alfa">Alfa</option>
          </select>
        </div>

        <div class="pt-2">
          <button type="submit" id="btnKirim" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-2xl transition text-sm shadow-sm">
            Kirim Absensi
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-slate-400 font-medium">
    &copy; 2026 Sistem Absensi Santri
  </footer>

  <script>
    // 1. Cek Sesi Login Santri
    const sessionData = localStorage.getItem('santriSession');
    if (!sessionData) {
      window.location.href = '/login-santri.html';
    }

    const currentSantri = JSON.parse(sessionData);

    // Tampilkan data profil santri
    document.getElementById('dispNama').innerText = currentSantri.fullName || 'Santri';
    const classInfo = currentSantri.classId ? `Kelas ${currentSantri.classId}` : 'Kelas -';
    document.getElementById('dispDetail').innerText = `NISN: ${currentSantri.nisn || '-'} | ${classInfo}`;

    function showAlert(message, isSuccess = true) {
      const box = document.getElementById('alertBox');
      box.className = `p-4 rounded-2xl text-sm font-medium shadow-sm block ${isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`;
      box.innerText = message;
    }

    function lockForm(message) {
      showAlert(message, false);
      const form = document.getElementById('formAbsensi');
      form.style.opacity = '0.5';
      document.getElementById('selectStatus').disabled = true;
      const btn = document.getElementById('btnKirim');
      btn.disabled = true;
      btn.innerText = 'Absensi Tidak Tersedia';
    }

    function logoutSantri() {
      localStorage.removeItem('santriSession');
      window.location.href = '/login-santri.html';
    }

    // 2. Cek Batas Waktu Jam 14.30
    function cekBatasWaktu() {
      const sekarang = new Date();
      const jam = sekarang.getHours();
      const menit = sekarang.getMinutes();
      const totalMenit = jam * 60 + menit;
      const batasTutup = 14 * 60 + 30; // 14:30 WIB

      if (totalMenit > batasTutup) {
        lockForm('⚠️ Waktu absen telah ditutup. Anda tidak dapat melakukan absensi lewat dari pukul 14.30 WIB.');
        return false;
      }
      return true;
    }

    // 3. Cek Apakah Santri Ini Sudah Absen Hari Ini (1x per hari)
    async function cekSudahAbsenHariIni() {
      try {
        const res = await fetch('/api/absen/hari-ini');
        const result = await res.json();

        if (result.success && Array.isArray(result.data)) {
          // Cari apakah NISN santri ini sudah ada di rekap hari ini
          const recordHariIni = result.data.find(item => String(item.nisn) === String(currentSantri.nisn));

          if (recordHariIni) {
            lockForm(`✅ Anda sudah melakukan absensi hari ini dengan keterangan status: "${recordHariIni.keterangan}". Absensi hanya bisa dilakukan 1 kali per hari.`);
            return true;
          }
        }
      } catch (err) {
        console.error('Gagal mengecek status absensi:', err);
      }
      return false;
    }

    // 4. Submit Absensi
    document.getElementById('formAbsensi').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!cekBatasWaktu()) return;

      const btn = document.getElementById('btnKirim');
      const status = document.getElementById('selectStatus').value;

      btn.disabled = true;
      btn.innerText = 'Mengirim Absensi...';

      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId: parseInt(currentSantri.id), status })
        });
        const result = await res.json();

        if (res.ok && result.success) {
          showAlert('✅ Absensi berhasil dicatat!');
          setTimeout(() => {
            lockForm(`✅ Anda telah berhasil absen hari ini dengan status "${status}".`);
          }, 1000);
        } else {
          showAlert(`⚠️ ${result.message || 'Gagal mencatat absensi'}`, false);
          btn.disabled = false;
          btn.innerText = 'Kirim Absensi';
        }
      } catch (err) {
        showAlert('❌ Gagal terhubung ke server.', false);
        btn.disabled = false;
        btn.innerText = 'Kirim Absensi';
      }
    });

    // Inisialisasi saat halaman dimuat
    async function init() {
      const sudahAbsen = await cekSudahAbsenHariIni();
      if (!sudahAbsen) {
        cekBatasWaktu();
      }
    }

    init();
  </script>
</body>
</html>
