<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa - Al-Atsar Solo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">
  
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50 border-b border-emerald-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="logo.png" onerror="this.style.display='none'" alt="Logo Al-Atsar" class="w-10 h-10 object-contain rounded-xl bg-white p-1 shadow-sm flex-shrink-0">
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-emerald-50">Al-Atsar Solo</h1>
          <p class="text-emerald-200 text-xs hidden sm:block">Portal Siswa</p>
        </div>
      </div>
      <a href="index.html" class="text-xs bg-emerald-800 hover:bg-emerald-700 text-emerald-100 font-medium px-3.5 py-2 rounded-xl border border-emerald-700 transition flex items-center gap-1.5">
        <i data-lucide="home" class="w-3.5 h-3.5"></i> Menu Utama
      </a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 sm:px-6 py-8 sm:py-12 w-full space-y-6">
    <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium shadow-sm"></div>
    
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200/80">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-800 flex items-center justify-center mx-auto mb-3">
          <i data-lucide="user-check" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Masuk Portal Siswa</h2>
        <p class="text-xs text-slate-500 mt-1">Masukkan NIS kamu untuk melakukan presensi</p>
      </div>

      <form id="formLoginSantri" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nomor Induk Siswa (NIS)</label>
          <input type="text" id="inputNis" placeholder="Masukkan NIS siswa" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-slate-50/50 font-medium" required />
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-3.5 rounded-2xl transition text-sm shadow-sm active:scale-[0.99] flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i> Masuk Presensi
        </button>
      </form>
    </div>
  </main>

  <footer class="text-center py-6 text-xs text-slate-400 font-medium">&copy; 2026 Al-Atsar Solo</footer>

  <script>
    const checkSantri = localStorage.getItem('santriSession');
    if (checkSantri) {
      window.location.href = 'siswa.html';
    }

    document.getElementById('formLoginSantri').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nis = document.getElementById('inputNis').value.trim();
      const alertBox = document.getElementById('alertBox');
      const btnLogin = document.getElementById('btnLogin');

      alertBox.classList.add('hidden');
      btnLogin.disabled = true;
      btnLogin.innerText = 'Memeriksa NIS...';

      try {
        const res = await fetch(`/api/students/check?nis=${encodeURIComponent(nis)}`);
        const result = await res.json();

        if (res.ok && result.success) {
          localStorage.setItem('santriSession', JSON.stringify(result.data));
          window.location.href = 'siswa.html';
        } else {
          alertBox.className = 'p-4 rounded-2xl text-sm font-medium shadow-sm block bg-rose-50 text-rose-800 border border-rose-200';
          alertBox.innerText = `Gagal: ${result.message || 'NIS tidak ditemukan!'}`;
        }
      } catch (err) {
        alertBox.className = 'p-4 rounded-2xl text-sm font-medium shadow-sm block bg-rose-50 text-rose-800 border border-rose-200';
        alertBox.innerText = 'Gagal terhubung ke server database.';
      } finally {
        btnLogin.disabled = false;
        btnLogin.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Masuk Presensi';
        lucide.createIcons();
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
