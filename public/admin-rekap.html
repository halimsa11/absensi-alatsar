<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Rekap Absensi</title>
  <link rel="icon" href="logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="toast.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  
  <!-- Header Responsif Mobile -->
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center justify-between w-full sm:w-auto gap-3">
        <div class="flex items-center gap-3">
          <img src="logo.png" onerror="this.style.display='none'" alt="Logo" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white p-1 object-contain">
          <h1 class="text-base sm:text-lg font-bold tracking-tight">Admin Dashboard</h1>
        </div>
        <!-- Tombol Menu Utama & Logout khusus Mobile -->
        <div class="sm:hidden flex gap-2">
          <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 transition">
            <i data-lucide="home" class="w-3.5 h-3.5"></i> Home
          </a>
          <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 transition">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
          </button>
        </div>
      </div>

      <!-- Menu Navigasi & Logout Desktop -->
      <div class="flex items-center justify-between w-full sm:w-auto gap-4 pt-2 sm:pt-0 border-t sm:border-0 border-emerald-800/60">
        <div class="flex gap-4 text-sm" id="navLinks">
          <a href="admin-siswa.html" id="linkKelolaSiswa" onclick="sessionStorage.setItem('flashToast', JSON.stringify({message: 'Beralih ke Kelola Data Siswa', type: 'info'}))" class="font-bold text-emerald-200 hover:text-white transition pb-0.5">Kelola Siswa</a>
          <a href="admin-rekap.html" class="font-bold text-white border-b-2 border-emerald-400 pb-0.5">Rekap Absensi</a>
        </div>
        <div class="hidden sm:flex gap-2">
          <a href="index.html" class="bg-emerald-800 hover:bg-emerald-700 text-emerald-50 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition shadow-sm border border-emerald-700">
            <i data-lucide="home" class="w-4 h-4"></i> Menu Utama
          </a>
          <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition shadow-sm">
            <i data-lucide="log-out" class="w-4 h-4"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <script>
    const roleCheck = localStorage.getItem('stafRole');
    if (roleCheck === 'admin') {
      const linkKelola = document.getElementById('linkKelolaSiswa');
      if (linkKelola) linkKelola.style.display = 'none';
    }
  </script>

  <main class="max-w-6xl mx-auto px-4 py-6 sm:py-8 space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 id="pageTitle" class="font-bold text-lg mb-4 text-emerald-800 flex items-center gap-2">
        <i data-lucide="calendar-days" class="w-5 h-5"></i> Rekap Harian
      </h2>
      
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <div class="flex-1">
          <label class="block text-xs font-bold text-slate-500 mb-1">Tanggal</label>
          <input type="date" id="tglInput" class="w-full border px-4 py-2.5 rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-600 outline-none">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-bold text-slate-500 mb-1">Filter Kelas</label>
          <select id="filterKelas" class="w-full border px-4 py-2.5 rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-600 outline-none">
            <option value="semua">Semua Kelas</option>
            <option value="10">Kelas 10</option>
            <option value="11">Kelas 11</option>
            <option value="12">Kelas 12</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="loadRekap()" class="w-full sm:w-auto bg-emerald-800 hover:bg-emerald-900 text-white px-6 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition">
            <i data-lucide="search" class="w-4 h-4"></i> Tampilkan
          </button>
        </div>
      </div>

      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100/80 text-slate-600 border-b">
            <tr>
              <th class="p-4 font-bold w-12 text-center">No</th>
              <th class="p-4 font-bold">Waktu Masuk (WIB)</th>
              <th class="p-4 font-bold">NIS</th>
              <th class="p-4 font-bold">Nama Lengkap</th>
              <th class="p-4 font-bold">Kelas</th>
              <th class="p-4 font-bold">Status</th>
            </tr>
          </thead>
          <tbody id="tabelRekap" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('stafToken');
    if (!token) window.location.href = 'login-staf.html';
    const getBaseUrl = () => '';

    function logout() { 
      sessionStorage.setItem('flashToast', JSON.stringify({ message: 'Anda telah berhasil logout.', type: 'info' }));
      localStorage.removeItem('stafToken'); 
      localStorage.removeItem('stafRole');
      window.location.href = 'login-staf.html'; 
    }

    document.getElementById('tglInput').value = new Date().toISOString().split('T')[0];

    async function loadRekap() {
      const dateVal = document.getElementById('tglInput').value;
      const kelasVal = document.getElementById('filterKelas').value;

      try {
        const res = await fetch(`${getBaseUrl()}/api/attendance?date=${dateVal}`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.status === 401 || res.status === 403) return logout();
        const result = await res.json();
        
        let rows = '';
        let dataTampil = result.data || [];

        if (kelasVal !== 'semua') {
          dataTampil = dataTampil.filter(r => {
            const namaKelas = r.className ? String(r.className) : '';
            return namaKelas.includes(kelasVal);
          });
        }

        if(dataTampil.length === 0) {
          rows = `<tr><td colspan="6" class="p-6 text-center text-slate-500">Belum ada data presensi yang sesuai.</td></tr>`;
        } else {
          dataTampil.forEach((r, idx) => {
            let wibTime = '-';
            if (r.checkInTime) {
               const dt = new Date(r.checkInTime);
               wibTime = dt.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB';
            }

            const teksKelas = r.className ? r.className : '-';
            const statusClean = r.status ? r.status.trim().toLowerCase() : '';

            let badgeColor = 'bg-emerald-100 text-emerald-800';
            let statusText = r.status || 'Hadir';

            if (statusClean.includes('terlambat')) {
              badgeColor = 'bg-amber-100 text-amber-800 border border-amber-200';
              statusText = 'Terlambat';
            } else if (statusClean === 'sakit') {
              badgeColor = 'bg-blue-100 text-blue-800';
              statusText = 'Sakit';
            } else if (statusClean === 'alfa') {
              badgeColor = 'bg-rose-100 text-rose-800';
              statusText = 'Alfa';
            } else if (statusClean === 'izin') {
              badgeColor = 'bg-sky-100 text-sky-800';
              statusText = 'Izin';
            }

            rows += `
              <tr class="hover:bg-slate-50 transition">
                <td class="p-4 text-center text-slate-500">${idx + 1}</td>
                <td class="p-4 font-medium text-slate-900">${wibTime}</td>
                <td class="p-4 text-slate-600">${r.nisn || '-'}</td>
                <td class="p-4 text-slate-800">${r.studentName || '-'}</td>
                <td class="p-4 text-slate-600">${teksKelas}</td>
                <td class="p-4">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold ${badgeColor}">
                    ${statusText}
                  </span>
                </td>
              </tr>
            `;
          });
        }
        document.getElementById('tabelRekap').innerHTML = rows;
      } catch (err) {
        showToast('Gagal memuat rekap absensi', 'error');
      }
    }

    loadRekap();
    checkFlashToast('Selamat datang di dashboard admin');
    lucide.createIcons();
  </script>
</body>
</html>
