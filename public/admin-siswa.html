<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Kelola Data Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="toast.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  
  <!-- Header Responsif Mobile -->
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center justify-between w-full sm:w-auto gap-3">
        <div class="flex items-center gap-3">
          <img src="logo.png" onerror="this.style.display='none'" alt="Logo" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white p-1 object-contain">
          <h1 class="text-base sm:text-lg font-bold tracking-tight">Admin Dashboard</h1>
        </div>
        <!-- Tombol Logout khusus Mobile di pojok kanan atas baris pertama -->
        <button onclick="logout()" class="sm:hidden bg-rose-600 hover:bg-rose-700 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 transition">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
        </button>
      </div>

      <!-- Menu Navigasi & Logout Desktop -->
      <div class="flex items-center justify-between w-full sm:w-auto gap-4 pt-2 sm:pt-0 border-t sm:border-0 border-emerald-800/60">
        <div class="flex gap-4 text-sm">
          <a href="admin-siswa.html" class="font-bold text-white border-b-2 border-emerald-400 pb-0.5">Kelola Siswa</a>
          <a href="admin-rekap.html" onclick="sessionStorage.setItem('flashToast', JSON.stringify({message: 'Beralih ke Rekap Absensi', type: 'info'}))" class="font-bold text-emerald-200 hover:text-white transition pb-0.5">Rekap Absensi</a>
        </div>
        <button onclick="logout()" class="hidden sm:flex bg-rose-600 hover:bg-rose-700 px-4 py-2 rounded-xl text-xs font-bold items-center gap-2 transition shadow-sm">
          <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 sm:py-8 space-y-6">
    
    <!-- Form Input / Edit -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 id="formTitle" class="font-bold text-lg mb-4 text-emerald-800 flex items-center gap-2">
        <i data-lucide="user-plus" class="w-5 h-5"></i> Input Data Siswa
      </h2>
      <form id="formSiswa" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
        <div class="md:col-span-3">
          <label class="block text-xs font-bold text-slate-500 mb-1">NIS</label>
          <input type="text" id="inputNisn" required class="w-full border px-4 py-2.5 rounded-xl bg-slate-50 focus:ring-2 focus:ring-emerald-600 outline-none text-sm" placeholder="Misal: 123456">
        </div>
        <div class="md:col-span-5">
          <label class="block text-xs font-bold text-slate-500 mb-1">Nama Lengkap</label>
          <input type="text" id="inputNama" required class="w-full border px-4 py-2.5 rounded-xl bg-slate-50 focus:ring-2 focus:ring-emerald-600 outline-none text-sm" placeholder="Nama Lengkap Siswa">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-slate-500 mb-1">Kelas</label>
          <select id="inputKelas" class="w-full border px-4 py-2.5 rounded-xl bg-slate-50 focus:ring-2 focus:ring-emerald-600 outline-none text-sm">
            <option value="10">Kelas 10</option>
            <option value="11">Kelas 11</option>
            <option value="12">Kelas 12</option>
          </select>
        </div>
        <div class="md:col-span-2 flex gap-2">
          <button type="submit" id="btnSimpan" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-2.5 rounded-xl text-sm transition">Simpan</button>
          <button type="button" id="btnBatal" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-4 rounded-xl text-sm transition">Batal</button>
        </div>
      </form>
    </div>

    <!-- Tabel Daftar Siswa & Search Bar -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4">
        <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5"></i> Daftar Siswa
        </h2>
        
        <div class="w-full sm:w-72 relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
          <input type="text" id="searchSiswa" oninput="renderTabel()" placeholder="Cari nama atau NIS..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 outline-none transition">
        </div>
      </div>

      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100/80 text-slate-600 border-b">
            <tr>
              <th class="p-4 font-bold w-12 text-center">No</th>
              <th class="p-4 font-bold">NIS</th>
              <th class="p-4 font-bold">Nama Lengkap</th>
              <th class="p-4 font-bold">Kelas</th>
              <th class="p-4 font-bold text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelSiswa" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('stafToken');
    if (!token) window.location.href = 'login-staf.html';
    
    const getBaseUrl = () => window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? `${window.location.protocol}//${window.location.hostname}:3000` : '';

    function logout() {
      sessionStorage.setItem('flashToast', JSON.stringify({ message: 'Anda telah berhasil logout.', type: 'info' }));
      localStorage.removeItem('stafToken');
      window.location.href = 'login-staf.html';
    }

    let editModeId = null; 
    let allStudents = [];

    async function loadSiswa() {
      try {
        const res = await fetch(`${getBaseUrl()}/api/students`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401 || res.status === 403) return logout();
        const result = await res.json();
        allStudents = result.data || [];
        renderTabel();
      } catch (err) {
        console.error('Gagal memuat siswa:', err);
        showToast('Gagal memuat data siswa dari server', 'error');
      }
    }

    function renderTabel() {
      const keyword = document.getElementById('searchSiswa').value.toLowerCase().trim();
      const filteredData = allStudents.filter(s => {
        const nama = s.fullName ? s.fullName.toLowerCase() : '';
        const nis = s.nisn ? String(s.nisn).toLowerCase() : '';
        return nama.includes(keyword) || nis.includes(keyword);
      });

      let rows = '';
      if (filteredData.length === 0) {
        rows = `<tr><td colspan="5" class="p-6 text-center text-slate-500">Tidak ada siswa yang ditemukan.</td></tr>`;
      } else {
        filteredData.forEach((s, idx) => {
          const cls = s.className ? s.className : `Kelas ${s.classId}`;
          rows += `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-4 text-center text-slate-500">${idx + 1}</td>
              <td class="p-4 font-medium text-slate-900">${s.nisn}</td>
              <td class="p-4 text-slate-800">${s.fullName}</td>
              <td class="p-4 text-slate-600">${cls}</td>
              <td class="p-4 text-center">
                <button onclick="editSiswa(${s.id}, '${s.nisn}', '${s.fullName}', ${s.classId})" class="text-emerald-600 hover:text-emerald-800 font-bold text-xs bg-emerald-50 px-3 py-1.5 rounded-lg mr-2 transition">Edit</button>
                <button onclick="hapusSiswa(${s.id})" class="text-rose-600 hover:text-rose-800 font-bold text-xs bg-rose-50 px-3 py-1.5 rounded-lg transition">Hapus</button>
              </td>
            </tr>
          `;
        });
      }
      document.getElementById('tabelSiswa').innerHTML = rows;
      lucide.createIcons();
    }

    document.getElementById('formSiswa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nisn = document.getElementById('inputNisn').value.trim();
      const fullName = document.getElementById('inputNama').value.trim();
      const classId = document.getElementById('inputKelas').value;
      
      const payload = { nisn, fullName, classId: parseInt(classId) };
      const btn = document.getElementById('btnSimpan');
      const isEditing = !!editModeId;
      btn.disabled = true; 
      btn.innerText = isEditing ? 'Mengupdate...' : 'Menyimpan...';

      try {
        const url = isEditing ? `${getBaseUrl()}/api/students/${editModeId}` : `${getBaseUrl()}/api/students`;
        const res = await fetch(url, {
          method: isEditing ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        if (res.status === 401 || res.status === 403) return logout();
        const result = await res.json();

        if (res.ok && result.success) {
          showToast(result.message || (isEditing ? 'Data siswa berhasil diperbarui!' : 'Data siswa berhasil ditambahkan!'), 'success');
          resetForm();
          loadSiswa();
        } else {
          showToast(result.message || (isEditing ? 'Gagal mengedit data siswa!' : 'Gagal menambahkan data siswa!'), 'error');
        }
      } catch (err) {
        showToast('Terjadi kesalahan koneksi server!', 'error');
      } finally {
        btn.disabled = false; 
        btn.innerText = editModeId ? 'Update' : 'Simpan';
      }
    });

    function editSiswa(id, nisn, fullName, classId) {
      editModeId = id;
      document.getElementById('inputNisn').value = nisn;
      document.getElementById('inputNama').value = fullName;
      document.getElementById('inputKelas').value = classId || 10;
      document.getElementById('formTitle').innerHTML = '<i data-lucide="edit" class="w-5 h-5"></i> Edit Data Siswa';
      document.getElementById('btnSimpan').innerText = 'Update';
      document.getElementById('btnBatal').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    function resetForm() {
      editModeId = null;
      document.getElementById('formSiswa').reset();
      document.getElementById('formTitle').innerHTML = '<i data-lucide="user-plus" class="w-5 h-5"></i> Input Data Siswa';
      document.getElementById('btnSimpan').innerText = 'Simpan';
      document.getElementById('btnBatal').classList.add('hidden');
      lucide.createIcons();
    }

    async function hapusSiswa(id) {
      if (!confirm("Yakin hapus siswa ini?")) return;
      try {
        const res = await fetch(`${getBaseUrl()}/api/students/${id}`, { 
          method: 'DELETE', 
          headers: { 'Authorization': `Bearer ${token}` } 
        });
        if (res.status === 401 || res.status === 403) return logout();
        const result = await res.json();
        if (res.ok && result.success) {
          showToast(result.message || 'Data siswa berhasil dihapus!', 'delete');
          loadSiswa();
        } else {
          showToast(result.message || 'Gagal menghapus data siswa!', 'error');
        }
      } catch (err) {
        showToast('Terjadi kesalahan koneksi saat menghapus siswa!', 'error');
      }
    }

    // Tampilkan notifikasi masuk halaman atau flash message
    checkFlashToast('Masuk ke Halaman Kelola Data Siswa');
    loadSiswa();
    lucide.createIcons();
  </script>
</body>
</html>
