<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staf - Kelola Data Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">
  
  <!-- Header Responsif -->
  <header class="bg-emerald-900 text-white shadow-sm sticky top-0 z-50 border-b border-emerald-800">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      <!-- Judul + Logo -->
      <div class="flex items-center gap-3">
        <img src="logo.png" onerror="this.style.display='none'" alt="Logo Al-Atsar" class="w-10 h-10 object-contain rounded-xl bg-white p-1 shadow-sm flex-shrink-0" />
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-emerald-50 flex items-center gap-2">
            <i data-lucide="shield-check" class="w-5 h-5 text-emerald-300"></i> Panel Staf
          </h1>
          <p class="text-emerald-100 text-xs">Kelola, daftarkan, dan hapus data siswa</p>
        </div>
      </div>

      <!-- Tombol Navigasi Header -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end pt-1 sm:pt-0 border-t sm:border-t-0 border-emerald-800/60">
        <a href="/index.html" class="text-xs bg-emerald-800 hover:bg-emerald-700 text-emerald-100 font-medium px-3 py-2 rounded-xl transition flex items-center justify-center gap-1.5 whitespace-nowrap">
          <i data-lucide="home" class="w-3.5 h-3.5"></i> Menu Utama
        </a>
        <a href="/admin-rekap.html" class="text-xs bg-emerald-800 hover:bg-emerald-700 text-emerald-100 font-medium px-3 py-2 rounded-xl transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Lihat Rekap
        </a>
        <button onclick="logoutStaf()" class="text-xs bg-rose-600 hover:bg-rose-700 text-white font-medium px-3 py-2 rounded-xl transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-10 w-full space-y-8">
    <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium shadow-sm"></div>

    <!-- Form Tambah Siswa -->
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200/80">
      <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
        <i data-lucide="user-plus" class="w-5 h-5 text-emerald-700"></i> Form Tambah Siswa Baru
      </h2>
      
      <form id="formTambahSiswa" class="space-y-4">
<div>
  <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nomor Induk Siswa (NIS)</label>
  <input type="text" id="inputNisn" placeholder="Masukkan NIS siswa" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-slate-50/50 font-medium" required />
</div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nama Lengkap Siswa</label>
          <input type="text" id="inputNama" placeholder="Masukan Nama Lengkap siswa"class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-slate-50/50 font-medium" required />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pilih Kelas</label>
          <select id="selectKelas" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-emerald-700 font-medium text-slate-800" required>
            <option value="">Pilih Kelas</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-3.5 rounded-2xl transition text-sm shadow-sm flex items-center justify-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Simpan Data ke Database
          </button>
        </div>
      </form>
    </div>

    <!-- Daftar Siswa & Tombol Hapus -->
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200/80 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5 text-emerald-700"></i> Daftar Seluruh Siswa Terdaftar
        </h2>
        <button onclick="loadDaftarSantri()" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-medium px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Data
        </button>
      </div>

      <div class="overflow-x-auto pb-2">
        <table class="w-full text-left border-collapse min-w-[500px]">
          <thead>
            <tr class="border-b border-slate-100 bg-slate-50/70 text-slate-500 text-xs uppercase font-bold tracking-wider">
              <th class="py-3 px-4 w-12 text-center">No</th>
              <th class="py-3 px-4">Nama Siswa</th>
              <th class="py-3 px-4">NIS</th>
              <th class="py-3 px-4">Kelas</th>
              <th class="py-3 px-4 text-center w-28">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelDaftarSantri" class="divide-y divide-slate-100 text-sm font-medium">
            <tr><td colspan="5" class="py-8 text-center text-slate-400">Memuat data Siswa...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-slate-400 font-medium">
    &copy; 2026 Sistem Absensi Siswa • Staf Panel
  </footer>

  <script>
    const checkSession = localStorage.getItem('stafSession') || localStorage.getItem('stafToken');
    if (!checkSession) {
      window.location.href = '/login-staf.html';
    }

    function logoutStaf() {
      localStorage.removeItem('stafSession');
      localStorage.removeItem('stafToken');
      window.location.href = '/login-staf.html';
    }

    function showAlert(message, isSuccess = true) {
      const box = document.getElementById('alertBox');
      box.className = `p-4 rounded-2xl text-sm font-medium shadow-sm block ${isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`;
      box.innerText = message;
      setTimeout(() => box.classList.add('hidden'), 4000);
    }

    async function loadDaftarSantri() {
      const tbody = document.getElementById('tabelDaftarSantri');
      try {
        const res = await fetch('/api/students');
        const result = await res.json();
        if (result.success && result.data.length > 0) {
          tbody.innerHTML = '';
          result.data.forEach((santri, index) => {
            let namaKelas = santri.classId;
            if (santri.classId == 10) namaKelas = '10';
            else if (santri.classId == 11) namaKelas = '11';
            else if (santri.classId == 12) namaKelas = '12';

            tbody.innerHTML += `
              <tr class="hover:bg-slate-50/60 transition">
                <td class="py-3 px-4 text-center text-slate-400 text-xs">${index + 1}</td>
                <td class="py-3 px-4 text-slate-900 font-bold">${santri.fullName}</td>
                <td class="py-3 px-4 font-mono text-slate-600 text-xs">${santri.nisn || santri.nis || '-'}</td>
                <td class="py-3 px-4 text-slate-600 text-xs">${namaKelas}</td>
                <td class="py-3 px-4 text-center">
                  <button onclick="hapusSantri(${santri.id}, '${santri.fullName}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold px-3 py-1.5 rounded-xl border border-rose-200 transition whitespace-nowrap flex items-center gap-1 mx-auto">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus
                  </button>
                </td>
              </tr>
            `;
          });
          lucide.createIcons();
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">Belum ada siswa yang terdaftar.</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-500">Gagal memuat data siswa.</td></tr>`;
      }
    }

    async function hapusSantri(id, nama) {
      if (!confirm(`Apakah kamu yakin ingin menghapus data siswa "${nama}"?`)) return;

      try {
        const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (res.ok && result.success) {
          showAlert(`✅ ${result.message}`);
          loadDaftarSantri(); 
        } else {
          showAlert(`⚠️ ${result.message || 'Gagal menghapus'}`, false);
        }
      } catch (err) {
        showAlert('❌ Gagal terhubung ke server saat menghapus data.', false);
      }
    }

    document.getElementById('formTambahSiswa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nisn = document.getElementById('inputNisn').value.trim();
      const fullName = document.getElementById('inputNama').value.trim();
      const classId = parseInt(document.getElementById('selectKelas').value);

      try {
        const res = await fetch('/api/students', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nisn, fullName, classId })
        });
        const result = await res.json();
        if (res.ok && result.success) {
          showAlert('✅ Data siswa berhasil ditambahkan!');
          document.getElementById('formTambahSiswa').reset();
          loadDaftarSantri(); 
        } else {
          showAlert(`⚠️ ${result.message}`, false);
        }
      } catch (err) {
        showAlert('❌ Gagal terhubung ke server.', false);
      }
    });

    loadDaftarSantri();
    lucide.createIcons();
  </script>
</body>
</html>
