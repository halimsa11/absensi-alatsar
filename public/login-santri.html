<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Siswa - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">
  
  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-sm">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-tight">🔑 Login Portal Siswa</h1>
        <p class="text-slate-400 text-xs">Masukkan NIS untuk masuk ke portal absensi</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3.5 py-2 rounded-xl transition">Menu Utama</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto px-6 py-12 w-full space-y-6">
    <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium shadow-sm"></div>

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80">
      <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
        <span>👤</span> Login Siswa
      </h2>
      
      <form id="formLogin" class="space-y-4" autocomplete="off">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nomor NIS</label>
          <input type="text" id="inputNisn" placeholder="Masukkan NIS" required class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-slate-800 font-medium text-slate-800" />
        </div>

        <div class="pt-2">
          <button type="submit" id="btnLogin" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-2xl transition text-sm shadow-sm">
            Masuk Portal
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-slate-400 font-medium">
    &copy; 2026 Sistem Absensi Siswa Al Atsar
  </footer>

  <script>
    function showAlert(message, isSuccess = true) {
      const box = document.getElementById('alertBox');
      box.className = `p-4 rounded-2xl text-sm font-medium shadow-sm block ${isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`;
      box.innerText = message;
    }

    // Jika santri sudah login sebelumnya, langsung lempar ke santri.html
    if (localStorage.getItem('santriSession')) {
      window.location.href = '/santri.html';
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nisnInput = document.getElementById('inputNisn').value.trim();
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerText = 'Memeriksa NISN...';

      try {
        const res = await fetch('/api/students');
        const result = await res.json();

        if (result.success && Array.isArray(result.data)) {
          const foundSantri = result.data.find(s => String(s.nisn).trim() === nisnInput);

          if (foundSantri) {
            showAlert('✅ NIS Ditemukan! Mengalihkan ke halaman absensi...');
            localStorage.setItem('santriSession', JSON.stringify(foundSantri));
            setTimeout(() => {
              window.location.href = '/santri.html';
            }, 800);
          } else {
            showAlert('⚠️ NISN tidak terdaftar! Silakan periksa NISN kamu atau hubungi Staf.', false);
            btn.disabled = false;
            btn.innerText = 'Masuk Portal';
          }
        } else {
          showAlert('❌ Gagal memuat data santri dari server.', false);
          btn.disabled = false;
          btn.innerText = 'Masuk Portal';
        }
      } catch (err) {
        showAlert('❌ Terjadi kesalahan koneksi ke server.', false);
        btn.disabled = false;
        btn.innerText = 'Masuk Portal';
      }
    });
  </script>
</body>
</html>
